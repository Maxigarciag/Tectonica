<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="Pulso de la Tierra">
  <defs>
    <style>
      .wave { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .mark { fill: none; stroke: currentColor; stroke-width: 3; }
    </style>
  </defs>
  <!-- Marca: círculo de trazo fino -->
  <circle cx="100" cy="100" r="88" class="mark"/>
  <!-- Línea de onda sísmica que cruza el círculo horizontalmente -->
  <path class="wave" d="M20,100 C40,120 60,80 80,120 100,160 120,40 140,100 160,80 180,100"/>
  <!-- Punto central opcional (sismo) -->
  <circle cx="100" cy="100" r="4" fill="currentColor"/>
</svg>
