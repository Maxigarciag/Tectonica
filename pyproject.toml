[project]
name = "tectonica"
version = "0.1.0"
description = "Earthquake data pipeline for 3D globe visualization"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "psycopg[pool]>=3.2",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "psycopg[pool]>=3.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/ingest"]